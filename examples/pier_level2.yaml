# 計算例: 直杭式横桟橋のレベル2地震動（桟橋編 P4）
# pier_example.yaml と同じ桟橋を、杭を地盤ばねでモデル化して解析する
# 単位: 高さ・通り芯 m（D.L. 基準）、断面寸法 mm、荷重 kN・kN/m・kN·m、kh kN/m³
type: pier
name: 桟橋計算例（レベル2）

materials:
  C24: {fck: 24}
  SKK490: {steel: true, fy: 315}

sections:
  G1:
    b: 1200
    D: 1500
    material: C24
    cover: 70
    rebar:
      main: SD345
      shear: SD345
      dt: 100
      end:    {top: 10-D32, bottom: 10-D32, stirrup: 4-D16@200}   # 地震時の下端引張に備えて下端も増やす
      center: {top: 6-D29, bottom: 10-D32, stirrup: 4-D16@250}
  P1:
    pipe: {D: 1000, t: 14}
    material: SKK490
    corrosion: {outer: 2.0, inner: 0.0}          # 全塑性モーメントは腐食後の断面で算定
    stiffness: intact

grids:
  x: {B1: 0, B2: 6, B3: 12, B4: 18, B5: 24, B6: 30, B7: 36, B8: 42}
  y: {L: 0, M: 7, S: 14}

deck:
  top: 3.0
  model_level: 2.25
  soffit: 1.5
  slab_thickness: 0.40
  overhang: {sea: 1.5, land: 0.0}

unit_weight: {rc: 24.5}

beams:
  - {at: "*", section: G1}

piles:
  section: P1
  model: soil_spring                # 地盤ばねモデル（fixed_point = 仮想固定点）
  segment: 0.5                      # 地中部の分割長 [m]
  rows:                             # tip: 杭先端（省略時は海底面 − 5/β）、pu: 地盤反力度の上限 [kN/m²]（省略時は線形）
    L: {seabed: -4.0,  kh: 20000, tip: -24.0, Rcd: 5000, Rtd: 2000}
    M: {seabed: -8.0,  kh: 20000, tip: -28.0, Rcd: 6000, Rtd: 2500}
    S: {seabed: -12.0, kh: 15000, tip: -32.0, Rcd: 7000, Rtd: 3000}

actions:
  D: {pavement: 2.0}
  L: {surcharge: 20.0}
  Ls: {surcharge: 10.0}
  EQ: {kh: 0.15, directions: [x, y]}

combinations:                       # 係数は見本（港湾基準で要確認）
  永続_常時:   {state: 永続, factors: {D: 1.0, L: 1.0}}
  L1地震_+Y:   {state: 変動, factors: {D: 1.0, Ls: 1.0, EQy: 1.0}}
  L1地震_-Y:   {state: 変動, factors: {D: 1.0, Ls: 1.0, EQy: -1.0}}

# レベル2地震動のプッシュオーバー。要求側と判定基準は入力（港湾基準で要確認）
level2:
  directions: [+y, -y]              # 法線直角方向（海側・陸側）
  gravity: {D: 1.0, Ls: 1.0}        # 先に載せる長期荷重
  kh: 0.25                          # 照査用震度（要求水平力 = kh × W）。要求変位なら target_displacement [m]
  max_displacement: 0.6             # 解析を打ち切る上部工の変位 [m]
  step: 0.005                       # 1ステップの変位増分の上限 [m]
  post_yield_ratio: 0.001           # 杭の塑性ヒンジの降伏後剛性比
  inground_depth: 3.0               # 地中部のヒンジを置く深さ（海底面から 3/β まで）
  criteria:
    - no_mechanism                  # 要求点までに崩壊機構ができない
    - no_inground_plastic           # 地中部が全塑性に達しない
    - {pile_rotation: 0.02}         # 杭頭の塑性回転角 [rad]

# 側方流動のシナリオ（利用可否 U2）。地盤変位の分布・低減係数・載荷順序は入力（FLIP 等の結果または基準で要確認）
lateral_flow:
  流動_海側1m:
    direction: +y                   # 流動の向き（海側）
    surface: {L: 1.0, M: 0.8, S: 0.6}   # 海底面の地盤変位 [m]（杭の列ごと、または全列共通の値）
    depth: 8.0                      # 流動する層の厚さ [m]（海底面から）
    shape: cos                      # cos / linear / uniform
    kh_factor: 0.1                  # 流動層の地盤ばね剛性の低減係数（液状化）
    kh: 0.15                        # 同時に作用させる慣性力の換算震度（0 なら地盤変位のみ）
    order: simultaneous             # simultaneous / ground_first / inertia_first
    unload: true                    # 最後に慣性力を除荷して残留変位を求める
# 利用可否シナリオの一括実行（利用可否 U4）: python -m rcframe.port_batch examples/pier_level2.yaml -j 4
scenarios:
  base:                             # 全シナリオ共通の値（lateral_flow と同じ項目、単位 m）
    direction: +y
    shape: cos
    kh_factor: 0.1
    order: simultaneous
    surface_ratio: {L: 1.0, M: 0.8, S: 0.6}   # 列ごとの地盤変位の比（surface × 比）
  grid:                             # 候補の組合せ（3 × 2 × 2 × 2 = 24 シナリオ）
    surface: [0.25, 0.5, 1.0]       # 海側の列の海底面の地盤変位 [m]
    depth: [4.0, 8.0]               # 流動する層の厚さ [m]
    kh: [0.0, 0.15]                 # 同時に作用させる慣性力の換算震度
    ecu: [A, B]                     # 局部座屈ひずみの式（2段目のファイバーのヒンジで使う）
  screening: {segment: 1.0}         # 1段目: 地中部の分割 1 m、cos 式のヒンジ
  refine:                           # 2段目（入力の分割・ファイバー）に回す条件
    when: {pile_yield: true, residual: [0.1, 2.0]}   # 杭の降伏、または上部工の残留変位 [m] がこの範囲
  workers: 4                        # 並列数
# 被災後の利用可否の判定と許容荷重（利用可否 U5）。判定基準・必要な荷重は仮の値（ガイドライン・利用計画で要確認）
usability:
  required: {surcharge: 10, berthing: 500, tractive: 500}   # 利用に必要な荷重 [kN/m², kN, kN]
  remove: [Ls]                      # 地震時の上載荷重は利用時の荷重に置き換える
  limits:
    residual_displacement: {limited: 0.1, unusable: 0.3}    # 上部工の残留水平変位 [m]
    pile_rotation: {limited: 0.005, unusable: 0.02}         # 杭の残留の塑性回転角 [rad]
    pile_damage: {塑性化: limited, 局部座屈: unusable}
  allowable:
    pile: plastic                   # plastic（塑性回転が増えない）/ buckling（局部座屈しない）/ none
    deck_mu: true                   # 上部工の梁 |M| ≦ Mu
    pile_axial: true                # 杭の軸力 ≦ Rcd, Rtd
    fenders: [{x: 3.0, z: 1.0, friction: 0.0}]    # 接岸力の作用位置（省略時は actions.B の防舷材）
    bollards: [{x: 3.0, angle_h: 0, angle_v: 0}]  # 牽引力の作用位置（省略時は actions.T の係船柱）
