# 感度解析: 地盤定数（流動層の上限 pu・剛性の低減）と地盤変位の細かい範囲（kawasaki_higashiogishima.yaml と同じ桟橋）
# 川崎港 東扇島埠頭 −12m 岸壁 第3バース 第2・3区 桟橋部（直杭式横桟橋）の 1 ブロック（26 m × 16 m、杭 20 本）
# 出典: 川崎港設計計算書〔図面集〕（運輸省第二港湾建設局 横浜調査設計事務所、昭和60年3月、設計 S55〜56）
#   図2 一般図、図4 第2区標準断面図、図11 鋼管杭配置図、図48〜50 上部工形状図、図52〜57 梁配筋図、図64〜66 付帯施設
# 寸法は図面（スキャン）から読み取った値。地盤定数・材料・荷重・判定基準は仮定（下の各項目の注記を参照）
# 単位: 高さ・通り芯 m（C.D.L. 基準）、断面寸法 mm、荷重 kN・kN/m・kN·m、kh kN/m³
type: pier
name: 川崎港東扇島 −12m 岸壁 桟橋部（1 ブロック、感度解析）
report:
  title: 川崎港 東扇島埠頭 −12m 岸壁 桟橋部 利用可否シナリオ検討
  notes: 寸法は図面集から読み取り。地盤定数（N 値から換算）・材料・荷重・判定基準は仮定

materials:
  C24: {fck: 24}                    # 仮定: 当時の設計基準強度 σck = 240 kgf/cm² 相当
  STK50: {steel: true, fy: 315}     # STK50（現 STK490 相当）の降伏点

sections:
  # 梁の配筋は図55・56（法線直角方向 G5〜G9）の平面図 B−B（上端）・C−C（下端）と断面 a−a〜g−g から読み取り:
  #   幅 1,000 に主筋 9 本（8@100）。上端: 端部 D22 ×5 + D19 ×4、中央 D22 ×5（D22×10,000 の通し筋）
  #   下端: 端部 D25 ×5 + D22 ×4（杭頭部に定着）、中央 D22 ×5 + D16 ×4。スキャンのため本数・径は概略
  # せいは支間中央 1,500、杭位置 1,800（図55 Sect. A−A）。解析・Mu は安全側に 1,500 とする
  GY:                               # 法線直角方向の梁 G5〜G9
    b: 1000
    D: 1500
    material: C24
    cover: 100
    rebar:
      main: SD295                   # SD30 相当（仮定）
      shear: SD295
      dt: 120
      end:    {top: 8-D22, bottom: 8-D25, stirrup: 4-D13@200}   # 断面積の等しい 1 種の径に換算（D22×5+D19×4、D25×5+D22×4）
      center: {top: 5-D22, bottom: 7-D22, stirrup: 4-D13@300}   # D22×5+D16×4 を換算
  GX:                               # 法線平行方向の梁 G1〜G4（図52〜54）。配筋は判読が難しいため GY と同じとする
    b: 1000
    D: 1500
    material: C24
    cover: 100
    rebar:
      main: SD295
      shear: SD295
      dt: 120
      end:    {top: 8-D22, bottom: 8-D25, stirrup: 4-D13@200}
      center: {top: 5-D22, bottom: 7-D22, stirrup: 4-D13@300}
  P12:
    pipe: {D: 1000, t: 12}          # 図11: 陸側 3 列 φ1000 t12（STK50）
    material: STK50
    corrosion: {outer: 2.0, inner: 0.0}   # 仮定: 供用約 40 年、海中部の外面腐食 2 mm（杭頭はモルタルライニング）
    stiffness: intact
  P16:
    pipe: {D: 1000, t: 16}          # 図11: 海側の列 φ1000 t16
    material: STK50
    corrosion: {outer: 2.0, inner: 0.0}
    stiffness: intact

grids:
  x: {P1: 0, P2: 5.4, P3: 10.8, P4: 16.2, P5: 21.6}   # 図11: 4@5.40、ブロック端の張出し 2.20
  y: {L: 0, C2: 4.5, C1: 9.0, S: 13.5}                # 図11: 3@4.50（L: 陸側の列、S: 海側の列）

deck:
  top: 3.80                         # 図50: 天端 +3.80（海側）〜 +3.96（陸側）、勾配は無視
  model_level: 2.90
  soffit: 2.00                      # 図50: 下端 +2.00
  slab_thickness: 0.40              # 図58: 床版 400
  overhang: {sea: 1.40, land: 1.10, start: 2.20, end: 2.20}

unit_weight: {rc: 24.5}

beams:
  - {at: "*", section: GX}
  - {at: [P1/L-S, P2/L-S, P3/L-S, P4/L-S, P5/L-S], section: GY}   # 法線直角方向

piles:
  section: P12
  overrides:
    - {at: "*/S", section: P16}
  model: soil_spring
  segment: 0.5
  rows:                             # 海底面は図4 の捨石・割石の 1:2 斜面から推定（−4.5 〜 −12.1）、杭先端 −41.0（図4）
    # 地盤（仮定、土質調査なし）: 割石 N=20、置換砂 N=10（−13 〜 −38、浚渫置換）、原地盤 N=30
    #   kh = 0.15N [kgf/cm³] ≒ 1,470N [kN/m³]（港湾の慣用値）。pu は層ごとに一定の概略値
    L:  {seabed: -4.8,  tip: -41.0, layers: &soil [{bottom: -13.0, kh: 29000, pu: 600},
                                                  {bottom: -25.0, kh: 15000, pu: 600},
                                                  {bottom: -38.0, kh: 15000, pu: 600},
                                                  {bottom: -60.0, kh: 44000, pu: 1200}]}
    C2: {seabed: -7.0,  tip: -41.0, layers: *soil}
    C1: {seabed: -9.3,  tip: -41.0, layers: *soil}
    S:  {seabed: -12.1, tip: -41.0, layers: *soil}

actions:
  D: {pavement: 0.0}
  L: {surcharge: 20.0}              # 仮定: 常時の上載荷重
  Ls: {surcharge: 10.0}             # 仮定: 地震時の上載荷重
  EQ: {kh: 0.15, directions: [y]}   # 仮定: 設計震度

level2:
  directions: [+y]
  gravity: {D: 1.0, Ls: 1.0}
  kh: 0.25
  max_displacement: 1.0
  step: 0.01
  post_yield_ratio: 0.001
  inground_depth: 3.0
  criteria: [no_mechanism, no_inground_plastic]

# 一括実行: python -m rcframe.port_batch examples/kawasaki_sensitivity.yaml -o 結果 -j 4 --cards カード --report 報告書.html
# 流動層（ζ < H）の上限 = 600 × pu_factor（150 / 300 / 600 kN/m²）。上の layers では割石・置換砂の pu を 600 としている
scenarios:
  base: {direction: +y, shape: cos, order: simultaneous, kh: 0.0, bottom: -23.0, ecu: B}
  grid:                             # 5 × 2 × 3 × 3 = 90 ケース
    surface: [0.1, 0.15, 0.2, 0.3, 0.5]          # 陸側の列の海底面の地盤変位 [m]（細かい範囲）
    surface_ratio:
      - {L: 1.0, C2: 1.0, C1: 1.0, S: 1.0}       # 一様
      - {L: 1.0, C2: 0.8, C1: 0.6, S: 0.4}       # 陸側ほど大きい
    pu_factor: [0.25, 0.5, 1.0]                  # 流動層の地盤反力度の上限 150 / 300 / 600 kN/m²
    kh_factor: [0.05, 0.1, 0.2]                  # 流動層の地盤ばね剛性の低減係数
  screening: {segment: 1.0}
  refine: {when: {pile_yield: true, residual: [0.1, 2.0]}}
  workers: 4

usability:                          # 判定基準・必要な荷重は仮の値（これまでと同じ）
  required: {surcharge: 10, berthing: 500, tractive: 350}   # 牽引力は曲柱 35 t 型（図65）
  remove: [Ls]
  limits:
    residual_displacement: {limited: 0.1, unusable: 0.3}
    pile_rotation: {limited: 0.005, unusable: 0.02}
    pile_damage: {塑性化: limited, 局部座屈: unusable}
  allowable:
    pile: plastic
    deck_mu: true
    pile_axial: false               # 設計支持力（Rcd・Rtd）は不明
    fenders: [{x: 5.4, z: 2.8}, {x: 16.2, z: 2.8}]        # 図2・66: 防舷材の中心 +2.80
    bollards: [{x: 10.8}]
